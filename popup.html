<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Handsome Guy Code Review Assistant</title>
    <style>
      body {
        width: 300px;
        padding: 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        margin: 0;
      }

      .header {
        text-align: center;
        margin-bottom: 16px;
      }

      .header h3 {
        margin: 0;
        color: #667eea;
      }

      .status {
        padding: 12px;
        border-radius: 6px;
        margin-bottom: 12px;
        text-align: center;
        font-size: 14px;
      }

      .status.configured {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }

      .status.not-configured {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }

      .btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 6px;
        font-size: 14px;
        cursor: pointer;
        margin-bottom: 8px;
      }

      .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
      }

      .btn-secondary {
        background: #f8f9fa;
        color: #495057;
        border: 1px solid #dee2e6;
      }

      .instructions {
        font-size: 12px;
        color: #6c757d;
        text-align: center;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h3>🔍 Handsome Guy Review Code Assistant</h3>
      <p>AI-powered code analysis for GitHub PRs - v1.0</p>
      <p>Implement by SonLV handsome</p>
    </div>

    <div id="status" class="status"></div>

    <button id="openOptions" class="btn btn-primary">
      ⚙️ Configure Settings
    </button>

    <div class="instructions">
      <p>
        Navigate to a GitHub Pull Request and click the "AI Review" button to
        analyze code changes.
      </p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
